<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AuctionHub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout concept: an arcade cabinet. Sticky HUD up top, each page is a "screen" of extruded pixel panels
   floating over a perspective grid floor and a banded pixel sun. Items are voxel sprites you can rotate. */
:root{
  --ink:#120a28; --ink2:#1d1240; --ink3:#2c1c5e; --black:#07031a; --hud:#160d35;
  --edge:#6a4cd0; --edgeHi:#9b82ff; --grid:#5b34b8;
  --cream:#fff1d0; --dim:#b8abe6;
  --gold:#ffc933; --goldD:#c98a12; --goldL:#fff1a8;
  --lime:#5df28a; --limeD:#1f9b55; --limeL:#c9ffd9;
  --rose:#ff4f79; --roseD:#b8244a; --roseL:#ffc2d0;
  --sky:#49d6ff; --skyD:#2a7fd6; --skyL:#c4f0ff;
  --violet:#9b6dff; --violetD:#5b3fb0; --violetL:#d6c6ff;
  --silver:#cfd6e8;
  --f-display:'Press Start 2P','Courier New',monospace;
  --f-body:'VT323',ui-monospace,'Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--cream);font-family:var(--f-body);font-size:22px;line-height:1.15;-webkit-font-smoothing:none;font-smooth:never;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hud)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p,dl,dd,ul{margin:0;padding:0}
ul{list-style:none}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:4px dashed var(--sky);outline-offset:4px}

/* ---------- backdrop ---------- */
.bg{position:fixed;inset:0;z-index:-4;background:linear-gradient(180deg,#0a0520 0 16%,#100829 16% 32%,#170c38 32% 46%,#210f4f 46% 58%,#2f1768 58% 68%,#431d7c 68% 77%,#5d2587 77% 85%,#7a2d8c 85% 100%)}
.stars{position:fixed;left:0;top:0;width:4px;height:4px;z-index:-3;animation:twinkle 1.6s steps(2) infinite}
.sun{position:fixed;left:50%;bottom:18vh;width:min(78vw,520px);aspect-ratio:1;transform:translateX(-50%);z-index:-3;background-size:100% 100%;image-rendering:pixelated}
.floor{position:fixed;left:0;right:0;bottom:0;height:42vh;z-index:-2;overflow:hidden;perspective:360px;background:#12082e}
.floor::before{content:"";position:absolute;left:-70%;right:-70%;top:0;height:220%;transform-origin:50% 0;transform:rotateX(70deg);background:linear-gradient(var(--grid) 4px,transparent 4px) 0 0/100% 56px,linear-gradient(90deg,var(--grid) 4px,transparent 4px) 0 0/80px 100%;animation:floor .9s steps(7) infinite}
.floor::after{content:"";position:absolute;inset:0;background:linear-gradient(#12082e 0,rgba(18,8,46,.0) 45%)}
.crt{position:fixed;inset:0;z-index:60;pointer-events:none;background:repeating-linear-gradient(transparent 0 3px,rgba(0,0,0,.12) 3px 4px)}
@keyframes twinkle{50%{opacity:.35}}
@keyframes floor{to{background-position:0 56px,0 0}}

/* ---------- pixel primitives ---------- */
.panel,.btn,.field,.wallet,.cdd,.icon-btn,.userchip,.toast,.combo-list{--ec:var(--edge);--edges:0 -4px 0 0 var(--ec),0 4px 0 0 var(--ec),-4px 0 0 0 var(--ec),4px 0 0 0 var(--ec)}
.panel{position:relative;background:var(--ink2);box-shadow:var(--edges),inset 4px 4px 0 0 rgba(255,255,255,.06),inset -4px -4px 0 0 rgba(0,0,0,.28),8px 8px 0 0 var(--black),12px 12px 0 0 rgba(0,0,0,.4)}
.panel.pad{padding:22px}
.panel.hot{--ec:var(--gold)}
.panel.violet{--ec:var(--violet);background:#241557}
.panel.lime{--ec:var(--lime)}
.panel.rose{--ec:var(--rose)}
.btn{--ec:var(--black);--b:var(--gold);--bd:var(--goldD);--bh:var(--goldL);display:inline-flex;align-items:center;justify-content:center;gap:10px;font:11px/1.2 var(--f-display);letter-spacing:.04em;text-transform:uppercase;text-align:center;color:var(--black);background:var(--b);border:0;padding:15px 18px 13px;cursor:pointer;margin-bottom:4px;box-shadow:var(--edges),inset -4px -4px 0 0 var(--bd),inset 4px 4px 0 0 var(--bh),0 8px 0 0 var(--black);transition:transform .08s steps(2)}
.btn:hover{transform:translateY(-3px)}
.btn:active{transform:translateY(4px);box-shadow:var(--edges),inset -4px -4px 0 0 var(--bd),inset 4px 4px 0 0 var(--bh)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.lime{--b:var(--lime);--bd:var(--limeD);--bh:var(--limeL)}
.btn.sky{--b:var(--sky);--bd:var(--skyD);--bh:var(--skyL)}
.btn.rose{--b:var(--rose);--bd:var(--roseD);--bh:var(--roseL);color:var(--black)}
.btn.violet{--b:var(--violet);--bd:var(--violetD);--bh:var(--violetL)}
.btn.ghost{--b:var(--ink3);--bd:#1a0f3a;--bh:#4a3590;color:var(--cream)}
.btn.sm{font-size:9px;padding:11px 12px 9px}
.btn.wide{width:100%}
.field{display:block;width:100%;font:24px/1.1 var(--f-body);color:var(--cream);background:var(--black);border:0;padding:10px 12px 8px;margin:4px 0;box-shadow:var(--edges),inset 4px 4px 0 0 rgba(255,255,255,.04);outline:none;border-radius:0}
.field:focus{--ec:var(--gold)}
.field::placeholder{color:#7f72b4}
.field.sm{font-size:20px;padding:6px 10px 4px}
select.field{appearance:none;-webkit-appearance:none;padding-right:38px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--cream) 50%),linear-gradient(135deg,var(--cream) 50%,transparent 50%);background-position:calc(100% - 22px) 55%,calc(100% - 16px) 55%;background-size:6px 6px;background-repeat:no-repeat}
textarea.field{resize:vertical;min-height:108px}
.lbl{display:block;font:10px/1.4 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.lbl small{font:inherit;color:#8e80c6}
.tag{display:inline-block;font:9px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;padding:6px 8px 5px;background:var(--silver);color:var(--black);box-shadow:0 4px 0 0 rgba(0,0,0,.5);white-space:nowrap}
.tag.lime{background:var(--lime)}.tag.rose{background:var(--rose)}.tag.sky{background:var(--sky)}.tag.gold{background:var(--gold)}.tag.violet{background:var(--violet)}.tag.dark{background:var(--black);color:var(--dim)}
.spr{display:inline-block;width:var(--w,32px);height:var(--w,32px);flex:none;background-size:100% 100%;image-rendering:pixelated}
.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:grid;gap:32px}
.eyebrow{font:10px/1.5 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--sky)}
.h1{font:clamp(20px,4.4vw,34px)/1.3 var(--f-display);color:var(--gold);text-shadow:4px 4px 0 var(--roseD),8px 8px 0 var(--black);text-wrap:balance;margin:10px 0 14px}
.h2{font:clamp(16px,2.6vw,22px)/1.4 var(--f-display);color:var(--cream);text-shadow:4px 4px 0 var(--black);text-wrap:balance}
.h3{font:12px/1.5 var(--f-display);color:var(--gold);text-transform:uppercase;letter-spacing:.04em;margin-bottom:14px}
.sub{color:var(--dim);font-size:25px;max-width:58ch;line-height:1.1}
.muted{color:var(--dim)}
.money{font-family:var(--f-display);color:var(--lime);text-shadow:3px 3px 0 var(--black)}
.err{color:var(--roseL);background:#3a0f27;padding:8px 10px;border-left:8px solid var(--rose);margin-top:12px}
.ok{color:var(--limeL)}
.kv{display:grid;gap:10px}
.kv>div{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding-bottom:8px;border-bottom:4px dotted rgba(184,171,230,.22)}
.kv dt{color:var(--dim)}
.kv dd{text-align:right;min-width:0;overflow-wrap:anywhere}
.kv .big{font:15px var(--f-display);color:var(--lime);text-shadow:3px 3px 0 var(--black)}
.kv .hot{color:var(--rose)}

/* ---------- HUD ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--hud);box-shadow:0 4px 0 0 var(--edge),0 8px 0 0 var(--black)}
.hud-in{display:flex;align-items:center;gap:12px 18px;padding-block:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;background:none;border:0;cursor:pointer;font:14px/1 var(--f-display);color:var(--cream);text-shadow:4px 4px 0 var(--black);padding:0}
.logo b{color:var(--sky);font-weight:400}
.logo .spr{filter:drop-shadow(4px 4px 0 var(--black))}
.nav{display:flex;gap:6px;flex:1;min-width:0}
.tab{font:9px/1 var(--f-display);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;color:var(--dim);background:transparent;border:0;padding:13px 11px 11px;cursor:pointer;transition:transform .08s steps(2)}
.tab:hover{color:var(--cream);transform:translateY(-3px)}
.tab[aria-current="page"]{color:var(--black);background:var(--gold);--ec:var(--black);box-shadow:var(--edges),inset -4px -4px 0 0 var(--goldD),inset 4px 4px 0 0 var(--goldL)}
.tab.admin{color:var(--violetL)}
.tab.admin[aria-current="page"]{background:var(--violet);box-shadow:var(--edges),inset -4px -4px 0 0 var(--violetD),inset 4px 4px 0 0 var(--violetL);color:var(--black)}
.wallet{--ec:var(--goldD);display:flex;align-items:center;gap:10px;font:11px/1 var(--f-display);color:var(--gold);background:var(--black);padding:11px 14px 9px;box-shadow:var(--edges)}
.wallet small{font-size:8px;color:var(--goldD)}
.userchip,.icon-btn{--ec:var(--edge);display:flex;align-items:center;gap:10px;background:var(--ink3);border:0;cursor:pointer;font:10px/1 var(--f-display);color:var(--cream);padding:8px 12px 6px;box-shadow:var(--edges)}
.icon-btn{padding:11px 10px 9px;font-size:8px;color:var(--dim)}
.userchip:hover,.icon-btn:hover{--ec:var(--gold)}
.icon-btn[aria-pressed="true"]{color:var(--lime)}

/* ---------- page frame ---------- */
main{padding-block:48px 120px;display:block}
main.enter{animation:enter .4s steps(6) both}
@keyframes enter{from{transform:perspective(1200px) rotateX(10deg) translateY(24px)}to{transform:none}}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:44px}
.pagehead>div:first-child{min-width:0;flex:1 1 360px}
.back{background:none;border:0;cursor:pointer;color:var(--sky);font:11px var(--f-display);padding:0 0 28px;display:block}
.back:hover{color:var(--cream)}

/* ---------- voxel sprites ---------- */
.vox{width:var(--s);height:var(--s);perspective:700px;flex:none}
.vox-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:sway 4.5s steps(18) infinite alternate;transform:rotateY(var(--ry,0deg)) rotateX(var(--rx,0deg))}
.vox.spin .vox-in{animation:spin 3.2s steps(28) infinite}
.vox.still .vox-in{animation:none;transform:rotateY(-18deg) rotateX(6deg)}
.vl{position:absolute;inset:0;background-size:100% 100%;image-rendering:pixelated}
@keyframes sway{from{transform:rotateY(-34deg) rotateX(9deg)}to{transform:rotateY(34deg) rotateX(-5deg)}}
@keyframes spin{to{transform:rotateY(360deg)}}
.stage{position:relative;display:grid;place-items:center;height:210px;background:repeating-conic-gradient(#2c1c5e 0 25%,#34236d 0 50%) 0 0/16px 16px;box-shadow:inset 4px 4px 0 0 rgba(0,0,0,.55),inset -4px -4px 0 0 rgba(255,255,255,.05);margin-bottom:20px}
.stage::after{content:"";position:absolute;bottom:24px;left:50%;width:120px;height:16px;transform:translateX(-50%);background:rgba(7,3,26,.55);clip-path:polygon(12% 0,88% 0,88% 25%,100% 25%,100% 75%,88% 75%,88% 100%,12% 100%,12% 75%,0 75%,0 25%,12% 25%)}
.stage .vox{position:relative;z-index:1;margin-top:-18px}
.stage.big{height:340px;cursor:grab;touch-action:pan-y;user-select:none;margin-bottom:0}
.stage.big:active{cursor:grabbing}
.stage.big::after{width:200px;height:22px;bottom:34px}
.hint{position:absolute;left:14px;bottom:12px;font:8px var(--f-display);color:var(--dim);letter-spacing:.1em;z-index:2}
.stage .tag{position:absolute;top:12px;left:12px;z-index:2}
.stage .tag.you{left:auto;right:12px}

/* ---------- marketplace ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:center;margin-bottom:34px}
.hero-coin{padding-right:min(8vw,90px)}
.ticker{overflow:hidden;background:var(--black);box-shadow:0 -4px 0 0 var(--goldD),0 4px 0 0 var(--goldD);padding:12px 0 10px;margin:0 4px 44px;font:10px/1.4 var(--f-display);color:var(--gold);white-space:nowrap}
.ticker .track{display:inline-flex;gap:36px;animation:marq 38s linear infinite;padding-left:36px}
.ticker .sep{color:var(--rose)}
.ticker b{color:var(--cream);font-weight:400}
@keyframes marq{to{transform:translateX(-50%)}}
.searchbox{padding:20px;margin-bottom:28px}
.searchrow{display:flex;align-items:center;gap:14px}
.searchrow .field{margin:0}
.filters{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;margin-top:20px}
.chipb{border:0;cursor:pointer;font:9px/1 var(--f-display);text-transform:uppercase;padding:11px 12px 9px;background:var(--ink3);color:var(--dim);box-shadow:0 4px 0 0 var(--black),inset 3px 3px 0 0 rgba(255,255,255,.08)}
.chipb:hover{color:var(--cream)}
.chipb[aria-pressed="true"]{background:var(--sky);color:var(--black);box-shadow:0 4px 0 0 var(--skyD)}
.sortwrap{margin-left:auto;display:flex;align-items:center;gap:10px}
.sortwrap .lbl{margin:0}
.meta{font:10px/1.5 var(--f-display);color:var(--dim);margin:0 4px 28px;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:44px 40px}
.card{padding:16px;display:flex;flex-direction:column;transition:transform .12s steps(3);transform-style:preserve-3d}
[data-tilt]{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.card .stage{transform:translateZ(28px)}
.card-body{display:flex;flex-direction:column;gap:14px;flex:1;padding:4px 4px 6px}
.card h3{font:11px/1.7 var(--f-display);color:var(--cream);text-shadow:3px 3px 0 var(--black)}
.card .desc{color:var(--dim);font-size:21px;line-height:1.1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:3.3em}
.card .btn{margin-top:auto}
.empty{display:grid;justify-items:center;text-align:center;gap:16px;padding:56px 20px}
.empty h2{font:14px/1.6 var(--f-display);color:var(--cream);text-shadow:3px 3px 0 var(--black)}
.empty p{color:var(--dim);max-width:46ch}

/* ---------- auction detail ---------- */
.detail{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:44px;align-items:start}
.detail>div{display:grid;gap:36px;min-width:0}
.desc-l{font-size:25px;line-height:1.1}
.by{color:var(--dim);margin-top:10px}.by b{color:var(--cream);font-weight:400}
.cd{display:flex;align-items:center;gap:8px}
.cdd{--ec:var(--edge);font:clamp(18px,3.4vw,26px)/1 var(--f-display);color:var(--gold);background:var(--black);padding:14px 10px 11px;min-width:2.3ch;text-align:center;box-shadow:var(--edges);font-variant-numeric:tabular-nums;text-shadow:3px 3px 0 var(--goldD)}
.cd i{font:normal 18px var(--f-display);color:var(--rose);animation:blink 1s steps(2) infinite}
.cd.done .cdd{color:var(--rose);text-shadow:3px 3px 0 var(--roseD)}
@keyframes blink{50%{opacity:0}}
.lead{text-align:right}
.lead .money{font-size:clamp(20px,3.4vw,28px)}
.bidform{margin-top:26px;padding-top:22px;border-top:4px dotted rgba(184,171,230,.25)}
.bidtop{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.bidtop .min{color:var(--dim)}.bidtop .min b{color:var(--cream);font-weight:400}
.money-in{position:relative}
.money-in span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--gold);font:14px var(--f-display);pointer-events:none}
.money-in .field{padding-left:38px;font-size:28px}
.quick{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 22px}
.proxyhead{display:flex;gap:14px;align-items:flex-start}
.proxyhead .grow{flex:1;min-width:0}
.proxyhead h3{margin:0 0 6px;color:var(--violetL)}
.proxy-body{margin-top:18px;display:grid;gap:14px}
.proxy-body p{color:var(--dim);line-height:1.1}
.plog{display:grid;gap:6px;color:var(--violetL);font-size:20px;border-left:8px solid var(--violetD);padding-left:12px}
.minbtn{background:none;border:0;cursor:pointer;font:9px var(--f-display);color:var(--violetL);text-decoration:underline;text-underline-offset:4px;margin-left:auto;padding:4px}
.ledger{display:grid;gap:10px;max-height:300px;overflow:auto;padding-right:6px}
.ledger li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:8px 10px;background:var(--black)}
.ledger .n{font:9px var(--f-display);color:var(--dim)}
.ledger .amt{font:12px var(--f-display);color:var(--lime)}
.ledger .who{min-width:0;overflow-wrap:anywhere}
.ledger .who small{display:block;color:#8e80c6;font-size:18px}
.demo{border:4px dashed #4b3a8e;padding:16px;display:grid;gap:12px}

/* ---------- my bids / my auctions ---------- */
.list{display:grid;gap:36px}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px;align-items:center;padding:18px 22px}
.lrow .thumb{width:84px;height:84px;display:grid;place-items:center;background:repeating-conic-gradient(#2c1c5e 0 25%,#34236d 0 50%) 0 0/16px 16px;box-shadow:inset 4px 4px 0 0 rgba(0,0,0,.55)}
.lrow h3{font:12px/1.6 var(--f-display);color:var(--cream);text-shadow:3px 3px 0 var(--black)}
.lrow .info{display:grid;gap:10px;min-width:0}
.stats{display:flex;gap:10px 26px;flex-wrap:wrap;color:var(--dim)}
.stats b{color:var(--cream);font-weight:400}
.stats .m{color:var(--gold)}
.manage{grid-template-columns:auto minmax(0,1fr);align-items:start}
.manage .actions{grid-column:1/-1;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;padding-top:16px;border-top:4px dotted rgba(184,171,230,.25)}
.resform{display:flex;gap:12px;align-items:flex-end;flex:1 1 280px}
.resform>div{flex:1;min-width:0}
.resform .money-in .field{font-size:24px}

/* ---------- create ---------- */
.create{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:48px;align-items:start}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 22px}
.form{display:grid;gap:22px}
.combo{position:relative}
.combo .field{padding-right:46px}
.combo-btn{position:absolute;right:8px;top:8px;width:34px;height:34px;border:0;background:var(--ink3);color:var(--cream);cursor:pointer;font:10px var(--f-display)}
.combo-list{--ec:var(--gold);position:absolute;left:0;right:0;top:calc(100% + 10px);z-index:25;background:var(--black);max-height:240px;overflow:auto;box-shadow:var(--edges),8px 8px 0 0 rgba(0,0,0,.6)}
.combo-list li{padding:10px 14px 8px;cursor:pointer;display:flex;align-items:center;gap:10px}
.combo-list li:hover,.combo-list li[aria-selected="true"]{background:var(--gold);color:var(--black)}
.combo-list .none{color:var(--dim);cursor:default}
.preview{position:sticky;top:132px}
.preview .eyebrow{margin-bottom:22px;display:block}

/* ---------- receipts ---------- */
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px;margin-bottom:44px}
.stat{padding:22px;display:grid;gap:10px;transition:transform .12s steps(3)}
.stat .v{font:24px/1.3 var(--f-display);color:var(--cream);text-shadow:4px 4px 0 var(--black);overflow-wrap:anywhere}
.stat .v.g{color:var(--lime)}
.stat .v.s{font-size:14px;display:flex;align-items:center;gap:12px;color:var(--gold)}
.stat small{color:var(--dim);font-size:20px}

/* ---------- bidding rules ---------- */
function placeBid(a,bidder,amount,auto){a.bids.push({bidder:bidder,amount:Math.round(amount*100)/100,at:Date.now(),auto:!!auto});}
function afterBid(a,bidder){
  var p=S.proxies[a.id],m=me().name;
  if(!p||!p.active||bidder===m)return null;
  var next=curPrice(a)+1;
  if(next<=p.ceiling&&me().balance>=next){
    placeBid(a,m,next,true);
    p.log.unshift('Counter-bid '+money(next)+' after '+bidder+' bid '+money(next-1));
    return 'auto';
  }
  p.active=false;
  p.log.unshift('Ceiling '+money(p.ceiling)+' reached. Proxy stopped.');
  return 'ceiling';
}
function settle(a){
  if(a.status!=='ACTIVE')return null;
  var t=topBid(a);
  if(!t){a.status='NO SALE';return 'nobids';}
  if(a.reserve&&t.amount<a.reserve){a.status='NO SALE';return 'reserve';}
  a.status='SETTLED';a.winner=t.bidder;a.finalPrice=t.amount;
  S.receipts.push({id:uuid(),auctionId:a.id,title:a.title,seller:a.seller,buyer:t.bidder,amount:t.amount,at:Date.now()});
  var buyer=S.users.filter(function(u){return u.name===t.bidder;})[0],seller=S.users.filter(function(u){return u.name===a.seller;})[0];
  if(buyer)addBalance(buyer,-t.amount);
  if(seller)addBalance(seller,t.amount);
  return 'sold';
}
function announceSettle(a,r){
  var m=me().name;
  if(r==='sold'&&a.winner===m){toast('good','You won!',a.title+' settled at '+money(a.finalPrice)+'. Receipt issued.');beep(SND.coin);}
  else if(r==='sold'&&a.seller===m){toast('gold','Sold',a.title+' sold for '+money(a.finalPrice)+'.');beep(SND.coin);}
  else if(r==='reserve'&&(a.seller===m||myBids(a).length)){toast('bad','No sale',a.title+' closed below its reserve price.');}
  else if(r==='nobids'&&a.seller===m){toast('',  'No sale',a.title+' ended with no bids.');}
}

var SYN={workout:['fitness','kettlebell','gym','weights'],gym:['fitness','kettlebell'],exercise:['fitness','kettlebell'],sound:['audio','earbuds','headphones'],music:['audio','earbuds'],listen:['audio','earbuds'],headphones:['earbuds','audio'],photo:['photography','camera'],photos:['photography','camera'],picture:['camera'],video:['camera'],camp:['tent','outdoors'],camping:['tent','outdoors'],hike:['tent','outdoors'],sleep:['tent'],tennis:['racquet','sports'],racket:['racquet'],type:['keyboard'],typing:['keyboard'],game:['gaming','keyboard','console'],games:['gaming','console'],play:['gaming','console','sports'],retro:['console','gaming'],noise:['earbuds','audio']};
function score(a,q){
  var STOP=['a','an','the','for','of','to','and','with','something','i','want','need','my','in','on','that','is','it','some','good','best'];
  var toks=q.toLowerCase().split(/[^a-z0-9]+/).filter(function(t){return t&&STOP.indexOf(t)<0;});
  if(!toks.length)return q.trim()?0:1;
  var title=a.title.toLowerCase(),desc=a.desc.toLowerCase(),cat=a.cat.toLowerCase(),all=title+' '+desc+' '+cat,sc=0;
  toks.forEach(function(t){
    var s=t.replace(/s$/,'');
    if(title.indexOf(t)>-1||title.indexOf(s)>-1)sc+=3;
    else if(cat.indexOf(t)>-1||desc.indexOf(t)>-1||desc.indexOf(s)>-1)sc+=2;
    else if(SYN[t]&&SYN[t].some(function(w){return all.indexOf(w)>-1;}))sc+=1.5;
  });
  return sc/(toks.length*3);
}
function filtered(){
  var q=S.search.trim(),list=S.auctions.filter(function(a){return a.status==='ACTIVE';});
  if(S.cat!=='ALL')list=list.filter(function(a){return a.cat===S.cat;});
  var scored=list.map(function(a){return {a:a,s:q?score(a,q):1};});
  if(q)scored=scored.filter(function(x){return x.s>0;});
  scored.sort(function(x,y){
    if(q&&y.s!==x.s)return y.s-x.s;
    if(S.sort==='price-lo')return curPrice(x.a)-curPrice(y.a);
    if(S.sort==='price-hi')return curPrice(y.a)-curPrice(x.a);
    if(S.sort==='bids')return y.a.bids.length-x.a.bids.length;
    return x.a.endsAt-y.a.endsAt;
  });
  return scored;
}

function bidStatus(a){
  var m=me().name,t=topBid(a);
  if(a.status==='ACTIVE')return t&&t.bidder===m?['Winning','lime']:['Outbid','rose'];
  if(a.status==='SETTLED')return a.winner===m?['Won','gold']:['Lost','dark'];
  if(a.status==='CANCELLED')return ['Cancelled','rose'];
  return ['Reserve not met','dark'];
}
function bidsView(){
  var m=me().name,rows=S.auctions.filter(function(a){return myBids(a).length;});
  rows.sort(function(x,y){return Math.max.apply(null,myBids(y).map(function(b){return b.at;}))-Math.max.apply(null,myBids(x).map(function(b){return b.at;}));});
  var head=pageHead('','My Bids','Track your active bids, winning positions, and past auction outcomes.','<button class="btn" data-go="market">Explore Auctions</button>');
  if(!rows.length)return head+emptyState('gavel','No bids yet','Find something you like and place your first bid.','<button class="btn" data-go="market">Explore Auctions</button>');
  return head+'<div class="list">'+rows.map(function(a){
    var st=bidStatus(a),mb=Math.max.apply(null,myBids(a).map(function(b){return b.amount;}));
    return '<article class="panel lrow" data-tilt><div class="thumb">'+spr(a.sprite,60)+'</div><div class="info"><div class="row"><h3>'+esc(a.title)+'</h3><span class="tag '+st[1]+'">'+st[0]+'</span></div>'
      +'<div class="stats"><span>Your Highest Bid: <b class="m">'+money(mb)+'</b></span><span>Current Highest: <b>'+money(curPrice(a))+'</b></span><span>Status: <b>'+a.status+'</b></span></div></div>'
      +'<button class="btn ghost sm" data-go="auction:'+a.id+'">View Auction</button></article>';
  }).join('')+'</div>';
}

/* ---------- my auctions ---------- */

  var m=me().name,rows=S.auctions.filter(function(a){return a.seller===m;});

/* =====================================================================
   RENDER + ROUTER
   ===================================================================== */
var VALID={market:1,bids:1,mine:1,create:1,receipts:1,profile:1,admin:1,backfill:1,auction:1};
function view(){
  if(!S.signedIn)return titleView();
  switch(S.page){
    case 'auction':return auctionView(byId(S.aid));
    case 'bids':return bidsView();
    case 'mine':return mineView();
    case 'create':return createView();
    case 'receipts':return receiptsView();
    case 'profile':return profileView();
    case 'admin':return me().admin?adminView():marketView();
    case 'backfill':return me().admin?backfillView():marketView();
    default:return marketView();
  }
}
function render(animate){
  $('#hudHost').innerHTML=S.signedIn?hud():'';
  var m=$('#main');m.innerHTML=view();
  if(animate!==false){m.classList.remove('enter');void m.offsetWidth;m.classList.add('enter');}
}
function go(p,id,keepScroll){
  if(p==='auction'){S.aid=id;}
  S.page=p;
  try{if(location.hash.slice(1)!==p)location.hash=p;}catch(e){}
  render();
  if(!keepScroll){try{window.scrollTo(0,0);}catch(e){}}
}
window.addEventListener('hashchange',function(){
  var h=location.hash.slice(1);
  if(h&&VALID[h]&&h!==S.page&&S.signedIn){
    if(h==='auction'&&!byId(S.aid))h='market';
    S.page=h;render();
  }
});

/* ---------- confirm helper ---------- */
function confirmable(btn,fn){
  if(btn.dataset.armed){fn();return;}
  var txt=btn.textContent;btn.dataset.armed='1';btn.textContent=btn.dataset.confirm||'Confirm?';
  setTimeout(function(){if(btn&&btn.dataset){delete btn.dataset.armed;btn.textContent=txt;}},3500);
}

/* ---------- actions ---------- */
var ACT={
  start:function(){S.signedIn=true;S.page='market';render();beep(SND.ok);},
  logout:function(){S.signedIn=false;render();},
  sound:function(){S.sound=!S.sound;render(false);if(S.sound)beep(SND.tick);},
  'clear-search':function(){S.search='';S.cat='ALL';render(false);},
  'proxy-min':function(){S.proxyMin=!S.proxyMin;var b=$('#proxyBody'),t=$('[data-act="proxy-min"]');if(b)b.hidden=S.proxyMin;if(t){t.textContent=S.proxyMin?'Expand':'Minimize';t.setAttribute('aria-expanded',String(!S.proxyMin));}},
  disarm:function(el){var p=S.proxies[el.dataset.id];if(p){p.active=false;p.log.unshift('Proxy disarmed by you.');}refreshAuction();toast('','Proxy disarmed','Auto-bidding is off for this listing.');},
  rival:function(el){
    var a=byId(el.dataset.id);if(!a||a.status!=='ACTIVE')return;
    var m=me().name,pool=S.users.filter(function(u){return u.name!==a.seller&&u.name!==m;});
    var rival=pool[Math.floor(Math.random()*pool.length)].name;
    var amt=a.bids.length?curPrice(a)+1+Math.floor(Math.random()*5):a.start;
    placeBid(a,rival,amt);
    toast('',rival+' bid',money(amt)+' on '+a.title+'.');beep(SND.tick);
    var r=afterBid(a,rival);
    if(r==='auto')setTimeout(function(){toast('good','Proxy fired','Your proxy countered at '+money(curPrice(a))+'.');beep(SND.ok);},350);
    if(r==='ceiling')setTimeout(function(){toast('bad','Proxy stopped','Your ceiling was reached.');beep(SND.err);},350);
    refreshAuction();
  },
  ffwd:function(el){
    var a=byId(el.dataset.id);if(!a)return;
    var r=settle(a);announceSettle(a,r);
    if(r==='reserve'||r==='nobids')toast('','Auction closed',r==='reserve'?'Closed below its reserve price.':'Closed with no bids.');
    render(false);
  },
  end:function(el){var a=byId(el.dataset.id);if(!a)return;var r=settle(a);announceSettle(a,r);if(r!=='sold'||a.seller!==me().name)toast('','Auction ended',r==='sold'?'Sold.':(r==='reserve'?'Reserve price not met.':'No bids were placed.'));render(false);},
  cancel:function(el){var a=byId(el.dataset.id);confirmable(el,function(){if(a&&a.status==='ACTIVE'){a.status='CANCELLED';toast('bad','Auction cancelled',a.title+' was pulled from the marketplace.');beep(SND.err);}render(false);});},
  'cat-toggle':function(){var ul=$('#catList');if(ul&&ul.hidden)openCombo('');else closeCombo();var i=$('#cat');if(i)i.focus();},
  delete:function(el){confirmable(el,function(){
    S.auctions=S.auctions.filter(function(a){return a.seller!==me().name;});
    S.auctions.forEach(function(a){a.bids=a.bids.filter(function(b){return b.bidder!==me().name;});});
    S.receipts=S.receipts.filter(function(r){return r.buyer!==me().name;});
    S.proxies={};me().balance=10000;me().name='test_user1';me().email='test_user1@example.com';
    S.signedIn=false;render();toast('bad','Account deleted','Press Start to create a fresh player.');beep(SND.err);
  });},
  'refresh-radar':function(){render(false);toast('good','Radar refreshed',S.fraud.length+' flagged bids in view.');beep(SND.tick);},
  inject:function(){
    var act=S.auctions.filter(function(a){return a.status==='ACTIVE'&&a.seller!==me().name;});
    var a=act[Math.floor(Math.random()*act.length)]||S.auctions[0];
    var octet=40+S.fraud.length*7;
    var dev=Math.random()<.5;
    S.fraud.push({auction:a.id,bip:'203.0.113.'+octet,sip:dev?'198.51.100.'+(octet+3):'203.0.113.'+(octet+11),why:dev?'Device hash match':'Same /24 subnet'});
    render(false);toast('bad','Shill bid flagged','Matching '+(dev?'device signature':'IP subnet')+' found.');beep(SND.err);
  },
  'clear-fraud':function(){S.fraud=[];render(false);},
  backfill:function(){
    if(S.backfill.running)return;
    var todo=S.auctions.filter(function(a){return !S.indexed[a.id];});if(!todo.length)return;
    S.backfill.running=true;S.backfill.progress=(S.auctions.length-todo.length)/S.auctions.length*100;render(false);
    var i=0;
    var iv=setInterval(function(){
      if(S.page!=='backfill'){}
      var a=todo[i];if(a)S.indexed[a.id]=true;i++;
      S.backfill.progress=(S.auctions.length-todo.length+i)/S.auctions.length*100;
      if(S.page==='backfill')render(false);
      if(i>=todo.length){clearInterval(iv);S.backfill.running=false;if(S.page==='backfill')render(false);toast('good','Backfill complete',todo.length+' listings indexed.');beep(SND.coin);}
    },650);
  }
};

document.addEventListener('click',function(e){
  var t=e.target;
  var pick=t.closest&&t.closest('[data-cat-pick]');
  if(pick){var c=pick.getAttribute('data-cat-pick'),inp=$('#cat');if(inp){inp.value=c;S.draft.cat=c;}closeCombo();var pv=$('#pv');if(pv)pv.innerHTML=previewHTML();return;}
  if(!(t.closest&&t.closest('#catCombo')))closeCombo();
  var q=t.closest&&t.closest('[data-quick]');
  if(q){var i=$('#bidAmt'),a=byId(S.aid);if(i&&a){i.value=(minNext(a)+parseFloat(q.dataset.quick)).toFixed(2);updateBidBtn();}return;}
  var cp=t.closest&&t.closest('[data-cat]');
  if(cp){S.cat=cp.dataset.cat;$$('[data-cat]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.cat===S.cat));});refreshGrid();return;}
  var pr=t.closest&&t.closest('[data-preset]');
  if(pr){S.mintAmt=(parseFloat(S.mintAmt)||0)+parseFloat(pr.dataset.preset);var mi=$('#mintAmt');if(mi)mi.value=S.mintAmt;mintLabel();return;}
  var cy=t.closest&&t.closest('[data-copy]');
  if(cy){var txt=cy.dataset.copy;try{navigator.clipboard.writeText(txt).then(function(){toast('good','Copied','Receipt ID copied.');},function(){toast('','Receipt ID',txt);});}catch(er){toast('','Receipt ID',txt);}return;}
  var g=t.closest&&t.closest('[data-go]');
  if(g){var v=g.dataset.go;beep(SND.tick);if(v.indexOf('auction:')===0)go('auction',v.slice(8));else go(v);return;}
  var ac=t.closest&&t.closest('[data-act]');
  if(ac&&ACT[ac.dataset.act]){ACT[ac.dataset.act](ac);}
});
function mintLabel(){var b=$('#mintBtn');if(b)b.textContent='Mint +$'+fmt(parseFloat(S.mintAmt)||0)+' Points';}

document.addEventListener('input',function(e){
  var t=e.target,id=t.id;
  if(id==='q'){S.search=t.value;refreshGrid();}
  else if(id==='bidAmt'){updateBidBtn();}
  else if(id==='mintAmt'){S.mintAmt=t.value;mintLabel();}
  else if(id==='cat'){S.draft.cat=t.value;openCombo(t.value);var pv=$('#pv');if(pv)pv.innerHTML=previewHTML();}
  else if(id.indexOf('f-')===0){
    var k={'f-title':'title','f-desc':'desc','f-start':'start','f-reserve':'reserve','f-hours':'hours'}[id];
    if(k){S.draft[k]=t.value;var pv2=$('#pv');if(pv2)pv2.innerHTML=previewHTML();}
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='sort'){S.sort=t.value;refreshGrid();}
  if(t.id==='mintUser'){S.mintUser=t.value;render(false);}
});
document.addEventListener('focusin',function(e){if(e.target.id==='cat')openCombo(e.target.value===''?'':'');});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closeCombo();
  if(e.target&&e.target.id==='cat'&&e.key==='Enter'){
    var first=$('#catList li[data-cat-pick]');if(first&&!$('#catList').hidden){e.preventDefault();first.click();}
  }
});

function showErr(id,msg){var el=$('#'+id);if(el)el.innerHTML=msg?'<div class="err" role="alert">'+esc(msg)+'</div>':'';}
document.addEventListener('submit',function(e){
  var f=e.target;e.preventDefault();
  var m=me();
  if(f.id==='bidForm'){
    var a=byId(f.dataset.id),amt=Math.round(parseFloat($('#bidAmt').value)*100)/100;
    if(!a||a.status!=='ACTIVE'){showErr('bidErr','This auction is closed.');return;}
    if(isNaN(amt)){showErr('bidErr','Enter a bid amount.');beep(SND.err);return;}
    if(amt<minNext(a)){showErr('bidErr','Bid at least '+money(minNext(a))+'. Each bid must beat the leader by $1.00.');beep(SND.err);return;}
    if(amt>m.balance){showErr('bidErr','You only have '+fmt(m.balance)+' points. Ask an admin to mint more.');beep(SND.err);return;}
    placeBid(a,m.name,amt);showErr('bidErr','');
    toast('good','Bid placed',money(amt)+' on '+a.title+'. You lead.');beep(SND.ok);
    refreshAuction();
    return;
  }
  if(f.id==='proxyForm'){
    var a2=byId(f.dataset.id),c=Math.round(parseFloat($('#proxyCeil').value)*100)/100;
    if(!a2||a2.status!=='ACTIVE')return;
    if(isNaN(c)||c<minNext(a2)){showErr('proxyErr','Ceiling must be at least '+money(minNext(a2))+'.');beep(SND.err);return;}
    if(c>m.balance){showErr('proxyErr','Your ceiling is more than your '+fmt(m.balance)+' points.');beep(SND.err);return;}
    var p=S.proxies[a2.id]=S.proxies[a2.id]||{log:[]};
    p.active=true;p.ceiling=c;
    var t=topBid(a2);
    if(!t||t.bidder!==m.name){placeBid(a2,m.name,minNext(a2),true);p.log.unshift('Opening bid '+money(curPrice(a2))+' placed on arming.');}
    else p.log.unshift('Armed while leading at '+money(curPrice(a2))+'.');
    toast('good','Proxy armed','Ceiling '+money(c)+'. It will defend your lead.');beep(SND.ok);
    refreshAuction();
    return;
  }
  if(f.id==='createForm'){
    var d=S.draft,start=parseFloat(d.start),res=d.reserve===''?null:parseFloat(d.reserve),hrs=parseInt(d.hours,10);
    var catHit=CATS.filter(function(c){return c[0].toLowerCase()===d.cat.trim().toLowerCase();})[0];
    var msg='';
    if(d.title.trim().length<3)msg='Give your listing a title of at least 3 characters.';
    else if(!d.desc.trim())msg='Add a short description so bidders know what they are buying.';
    else if(isNaN(start)||start<=0)msg='Starting price must be greater than $0.';
    else if(res!==null&&(isNaN(res)||res<start))msg='Reserve price cannot be lower than the starting price.';
    else if(isNaN(hrs)||hrs<1||hrs>720)msg='Duration must be between 1 and 720 hours.';
    else if(!catHit)msg='Pick a category from the list.';
    if(msg){showErr('formErr',msg);beep(SND.err);return;}
    var id='12'+String(Date.now())+String(Math.floor(Math.random()*1e4)).padStart(4,'0');
    var na={id:id,title:d.title.trim(),desc:d.desc.trim(),seller:m.name,start:start,reserve:res,cat:catHit[0],sprite:catHit[1],endsAt:Date.now()+hrs*HR,status:'ACTIVE',bids:[]};
    S.auctions.unshift(na);S.indexed[id]=false;
    S.draft={title:'',desc:'',start:'',reserve:'',hours:'24',cat:''};
    toast('good','Auction published',na.title+' is live in the marketplace.');beep(SND.coin);
    go('mine');
    return;
  }
  if(f.classList.contains('resform')){
    var a3=byId(f.dataset.id),inp=$('input',f),v=inp.value===''?null:parseFloat(inp.value);
    if(!a3)return;
    if(v!==null&&(isNaN(v)||v<a3.start)){toast('bad','Reserve too low','Reserve must be at least the starting price of '+money(a3.start)+'.');beep(SND.err);return;}
    a3.reserve=v;toast('good','Reserve updated',v===null?'Reserve removed.':'Reserve set to '+money(v)+'.');beep(SND.ok);render(false);
    return;
  }
  if(f.id==='profileForm'){
    var nm=$('#p-name').value.trim(),em=$('#p-mail').value.trim();
    if(!/^[A-Za-z0-9_]{3,24}$/.test(nm)){showErr('profErr','Username needs 3 to 24 letters, numbers or underscores.');beep(SND.err);return;}
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){showErr('profErr','Enter a valid email address.');beep(SND.err);return;}
    if(S.users.some(function(u){return u!==m&&u.name===nm;})){showErr('profErr','That username is taken.');beep(SND.err);return;}
    var old=m.name;
    if(old!==nm){
      S.auctions.forEach(function(a){if(a.seller===old)a.seller=nm;if(a.winner===old)a.winner=nm;a.bids.forEach(function(b){if(b.bidder===old)b.bidder=nm;});});
      S.receipts.forEach(function(r){if(r.buyer===old)r.buyer=nm;if(r.seller===old)r.seller=nm;});
      if(S.mintUser===old)S.mintUser=nm;
    }
    m.name=nm;m.email=em;showErr('profErr','');render(false);toast('good','Profile saved','Your changes are live.');beep(SND.ok);
    return;
  }
  if(f.id==='mintForm'){
    var amount=Math.round(parseFloat(S.mintAmt)*100)/100;
    if(isNaN(amount)||amount<=0){toast('bad','Nothing to mint','Enter an amount above $0.');beep(SND.err);return;}
    var tu=S.users.filter(function(u){return u.name===S.mintUser;})[0];
    if(!tu)return;
    addBalance(tu,amount);render(false);
    toast('gold','Minted',money(amount)+' credited to '+tu.name+'.');beep(SND.coin);
  }
});

/* ---------- 3D: card tilt + stage drag ---------- */
var fine=window.matchMedia&&window.matchMedia('(hover:hover) and (pointer:fine)').matches;
var calm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
var tiltEl=null;
function resetTilt(el){if(el){el.style.setProperty('--rx','0deg');el.style.setProperty('--ry','0deg');}}
document.addEventListener('pointermove',function(e){
  if(drag){
    var d=e.clientX-drag.x,dy=e.clientY-drag.y;
    var v=drag.el.querySelector('.vox-in');
    if(v){v.style.animation='none';drag.ry+=d*.7;drag.rx=Math.max(-40,Math.min(40,drag.rx-dy*.4));v.style.transform='rotateY('+drag.ry+'deg) rotateX('+drag.rx+'deg)';}
    drag.x=e.clientX;drag.y=e.clientY;return;
  }
  if(!fine||calm)return;
  var t=e.target.closest&&e.target.closest('[data-tilt]');
  if(tiltEl&&tiltEl!==t)resetTilt(tiltEl);
  tiltEl=t;
  if(t){
    var r=t.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;
    t.style.setProperty('--ry',(px*14).toFixed(1)+'deg');t.style.setProperty('--rx',(-py*12).toFixed(1)+'deg');
  }
});
document.addEventListener('pointerleave',function(){resetTilt(tiltEl);tiltEl=null;});
var drag=null;
document.addEventListener('pointerdown',function(e){
  var st=e.target.closest&&e.target.closest('#stage3d');
  if(st){drag={el:st,x:e.clientX,y:e.clientY,ry:-20,rx:6};}
});
document.addEventListener('pointerup',function(){drag=null;});
document.addEventListener('pointercancel',function(){drag=null;});

/* ---------- clock ---------- */
setInterval(function(){
  var t=Date.now(),changed=false;
  if(S.signedIn){
    S.auctions.forEach(function(a){
      if(a.status==='ACTIVE'&&a.endsAt<=t){var r=settle(a);announceSettle(a,r);changed=true;}
    });
  }
  $$('[data-left]').forEach(function(el){
    var a=byId(el.dataset.left);if(a)el.textContent=a.status==='ACTIVE'?left(a.endsAt-t):'Closed';
  });
  var cd=$('#cd');
  if(cd&&S.page==='auction'){var a2=byId(S.aid);if(a2&&a2.status==='ACTIVE')cd.innerHTML=tiles(a2.endsAt-t);}
  if(changed)render(false);
},1000);

/* ---------- stars ---------- */
function stars(){
  var el=$('#stars');if(!el)return;
  var w=window.innerWidth||1200,h=(window.innerHeight||800)*.62,sh=[],i;
  for(i=0;i<80;i++){
    var x=Math.floor(Math.random()*w/4)*4,y=Math.floor(Math.random()*h/4)*4;
    sh.push(x+'px '+y+'px 0 0 '+(i%5===0?'#49d6ff':i%7===0?'#ffc933':'#fff1d0'));
  }
  el.style.boxShadow=sh.join(',');
}
window.addEventListener('resize',stars);

/* ---------- boot ---------- */
stars();
var h0=''; try{h0=location.hash.slice(1);}catch(e){}
if(h0&&VALID[h0]&&h0!=='auction')S.page=h0;
render();
})();
</script>
